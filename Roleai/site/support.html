<main class="support-shell"><section class="support-heading"><p class="eyebrow">ROLEAI SUPPORT</p><h1>帮助与支持工单</h1><p>有效订阅和终身授权用户可提交技术工单；账户、支付、退款、隐私与安全问题始终开放。</p></section>
<div class="support-layout"><aside class="support-nav"><button class="active" data-support-view="create">提交工单</button><button data-support-view="mine">我的工单</button><a href="./updates.html">已知问题与更新</a></aside><section class="support-content"><div id="support-notice" class="support-notice">正在检查账户与支持资格…</div>
<section id="support-create"><form id="support-ticket-form" class="support-form" novalidate data-custom-validation="support-ticket"><div class="form-field"><label for="support-category">问题类型</label><select id="support-category" name="category" required aria-describedby="support-category-error" data-error-required="请选择问题类型"></select><p id="support-category-error" class="field-error" aria-live="polite" hidden></p></div><div class="form-field"><label for="support-subject">标题</label><input id="support-subject" name="subject" required minlength="3" maxlength="160" aria-describedby="support-subject-error" data-error-required="请输入标题" data-error-too-short="标题至少需要 3 个字"><p id="support-subject-error" class="field-error" aria-live="polite" hidden></p></div><div class="form-field"><label for="support-message">详细说明</label><textarea id="support-message" name="message" required minlength="10" maxlength="20000" placeholder="请说明问题发生步骤、预期结果、实际结果和错误信息。请勿提交密码、验证码或支付密码。" aria-describedby="support-message-error support-form-note" data-error-required="请输入详细说明" data-error-too-short="详细说明至少需要 10 个字"></textarea><p id="support-message-error" class="field-error" aria-live="polite" hidden></p></div><p id="support-form-note" class="support-form-note">当前工单仅支持文字描述，请将关键错误信息脱敏后粘贴在正文中。</p><div id="public-contact" class="public-contact" hidden><div class="form-field"><label for="support-phone">联系手机号</label><input id="support-phone" name="phone" maxlength="32"></div><div class="form-field"><label for="support-email">联系邮箱</label><input id="support-email" name="email" type="email" maxlength="254" aria-describedby="support-email-error" data-error-type="邮箱格式不正确"><p id="support-email-error" class="field-error" aria-live="polite" hidden></p></div><div id="support-captcha-element" aria-hidden="true"></div><button type="button" id="support-captcha-trigger" hidden tabindex="-1" aria-hidden="true"></button><button type="button" id="support-human-verify" class="secondary">完成人机验证</button><input name="captcha_challenge_id" type="hidden"></div><button type="submit" class="primary">提交工单</button><p class="status-message" aria-live="polite"></p></form></section>
<section id="support-mine" hidden><form id="public-ticket-lookup" class="support-form" hidden novalidate data-custom-validation="ticket-lookup"><div class="form-field"><label for="public-ticket-id">公共工单号</label><input id="public-ticket-id" name="public_id" required pattern="RA[A-F0-9]{16}" maxlength="18" placeholder="RA…" aria-describedby="public-ticket-error" data-error-required="请输入公共工单号" data-error-pattern="工单号格式不正确"><p id="public-ticket-error" class="field-error" aria-live="polite" hidden></p></div><button type="submit" class="primary">安全查询</button><p class="status-message" aria-live="polite"></p></form><div id="support-ticket-list" class="support-ticket-list"><p>请先登录查看工单，或输入本浏览器已保存凭证的公共工单号。</p></div></section></section></div></main>
